          const tl = gsap.timeline({ paused: true });

          const boundary = document.getElementById("a3-boundary");
          const blen = boundary.getTotalLength();
          boundary.style.strokeDasharray = blen;
          boundary.style.strokeDashoffset = blen;

          // Camera rises off the airport footprint: starts tight on the airfield, pulls out to the whole district

            tl.to(
              sel,
              { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.7)" },
              4.0 + i * 0.5,
