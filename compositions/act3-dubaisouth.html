      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          const boundary = document.getElementById("a3-boundary");
          const blen = boundary.getTotalLength();
          boundary.style.strokeDasharray = blen;
          boundary.style.strokeDashoffset = blen;

          // Camera rises off the airport footprint (slight scale-down + settle)
          const mapWrap = document.getElementById("a3-map");
          tl.fromTo(
            mapWrap,
            { scale: 1.12 },
            { scale: 1.0, duration: 2.2, ease: "power3.out" },
            0,
          );

          tl.fromTo(
            boundary,
            { strokeDashoffset: blen },
            { strokeDashoffset: 0, duration: 2.0, ease: "power2.out" },
            0.5,
          );

          const districts = ["#a3-d1", "#a3-d2", "#a3-d3", "#a3-d4", "#a3-d5", "#a3-d6"];
          districts.forEach((sel, i) => {
            tl.to(
              sel,
              { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" },
              2.6 + i * 0.5,
            );
          });

          tl.to(
            "#a3-callouts",
            { opacity: 1, duration: 0.7, ease: "power2.out" },
            6.3,
          );

          // Ambient decoratives: hairline rings + ghost coordinate breathe slowly for the whole scene
          tl.to("#a3-ring1", { scale: 1.04, duration: 8, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
          tl.to("#a3-ring2", { scale: 0.97, duration: 10, ease: "sine.inOut", repeat: 2, yoyo: true }, 0);
          tl.to(".ghost-coord2", { opacity: 0.06, x: -12, duration: 12, ease: "sine.inOut", repeat: 2, yoyo: true }, 0);

          // Slow ambient drift for the rest of the scene
          const drift = { p: 0 };
          tl.to(
            drift,
            {
              p: Math.PI * 2,
              duration: 25.4 - 2.2,
              ease: "none",
              onUpdate: () => {
                const dx = Math.sin(drift.p) * 5;
                const dy = Math.sin(drift.p * 1.25) * 3;
                mapWrap.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.0)`;
              },
            },
            2.2,
          );

          window.__timelines["act3-dubaisouth"] = tl;
        })();
