<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #05070b;
          overflow: hidden;
          font-family: "Space Mono", monospace;
        }
        #root .mist {
          position: absolute;
          inset: -10%;
          background: radial-gradient(circle at 50% 45%, rgba(212, 175, 106, 0.35), rgba(5, 7, 11, 0) 55%),
            radial-gradient(circle at 50% 55%, rgba(240, 241, 232, 0.25), rgba(5, 7, 11, 0) 40%);
          opacity: 1;
          filter: blur(10px);
        }
        #root .camera {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        #root .coast-wrap {
          position: relative;
          width: 1600px;
          height: 900px;
        }
        #root svg.coast {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        #root .coast path {
          fill: none;
          stroke: #d4af6a;
          stroke-width: 3;
          stroke-linecap: round;
          stroke-linejoin: round;
          opacity: 0.85;
        }
        #root .pin {
          position: absolute;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #d4af6a;
          box-shadow: 0 0 0 0 rgba(212, 175, 106, 0.6);
          transform: scale(0);
          opacity: 0;
        }
        #root .ghost-coord {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          font-size: 320px;
          font-weight: 700;
          color: #d4af6a;
          opacity: 0.035;
          white-space: nowrap;
          letter-spacing: -0.04em;
        }
        #root .title {
          position: absolute;
          left: 50%;
          bottom: 190px;
          transform: translate(-50%, 24px);
          width: 1500px;
          text-align: center;
          opacity: 0;
          font-family: "League Gothic", sans-serif;
          font-weight: 400;
          font-size: 92px;
          line-height: 1.05;
          letter-spacing: -0.01em;
          color: #f0ebd8;
          text-transform: uppercase;
        }
        #root .title .accent {
          color: #d4af6a;
        }
        #root .vignette {
          position: absolute;
          inset: 0;
          box-shadow: inset 0 0 260px 60px rgba(5, 7, 11, 0.9);
        }
      </style>

      <div data-hf-id="hf-lc00" id="root" data-composition-id="act1-hook" data-width="1920" data-height="1080" data-duration="8.8">
        <div data-hf-id="hf-mbcg" class="mist" id="a1-mist" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-pyzc" class="camera" id="a1-camera" data-layout-allow-overflow="true">
          <div data-hf-id="hf-w4yr" class="coast-wrap">
            <div data-hf-id="hf-v18q" class="ghost-coord">25.2048° N</div>
            <svg data-hf-id="hf-p816" class="coast" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
              <path data-hf-id="hf-fa8c" id="a1-coastpath" d="M 80 620 C 300 560, 420 520, 560 540 C 700 560, 760 500, 900 470 C 1040 440, 1120 480, 1260 440 C 1400 400, 1460 360, 1540 300" />
            </svg>
            <div data-hf-id="hf-sx5v" class="pin" id="a1-pin1" style="left:300px; top:558px;"></div>
            <div data-hf-id="hf-fouo" class="pin" id="a1-pin2" style="left:560px; top:538px;"></div>
            <div data-hf-id="hf-gmbj" class="pin" id="a1-pin3" style="left:900px; top:468px;"></div>
            <div data-hf-id="hf-0xyx" class="pin" id="a1-pin4" style="left:1260px; top:438px;"></div>
            <div data-hf-id="hf-lkij" class="pin" id="a1-pin5" style="left:1150px; top:600px;"></div>
          </div>
        </div>
        <div data-hf-id="hf-izoe" class="title" id="a1-title">The next 30 years of <span data-hf-id="hf-z6fk" class="accent">Dubai</span> are being built right now.</div>
        <div data-hf-id="hf-q7bi" class="vignette"></div>
      </div>

      <script>
        (function () {
          const root = document.getElementById("root");
          const coast = document.getElementById("a1-coastpath");
          const len = coast.getTotalLength();
          coast.style.strokeDasharray = len;
          coast.style.strokeDashoffset = len;

          const tl = gsap.timeline({ paused: true });

          // Phase 1: mist clears (diving through cloud)
          tl.fromTo(
            "#a1-mist",
            { opacity: 1, scale: 1.4 },
            { opacity: 0, scale: 1, duration: 1.6, ease: "power2.out" },
            0.1,
          );

          // Coastline draws on as the mist clears
          tl.fromTo(
            coast,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 2.0, ease: "power2.out" },
            0.3,
          );

          // Pins ignite in sequence
          ["#a1-pin1", "#a1-pin2", "#a1-pin3", "#a1-pin4", "#a1-pin5"].forEach((sel, i) => {
            const at = 1.9 + i * 0.22;
            tl.to(sel, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, at);
            tl.to(
              sel,
              { boxShadow: "0 0 18px 6px rgba(212,175,106,0.5)", duration: 0.5, ease: "power1.out" },
              at,
            );
          });

          // Camera: slow continuous push-in with micro-drift (multi-phase-camera)
          const phase = { scale: 1.12 };
          tl.to(phase, { scale: 1.0, duration: 2.2, ease: "power3.out" }, 0.1);
          tl.to(phase, { scale: 0.96, duration: 3.0, ease: "power2.inOut" }, 3.0);
          const drift = { p: 0 };
          const camera = document.getElementById("a1-camera");
          tl.to(
            drift,
            {
              p: Math.PI * 2 * 1,
              duration: 8.8,
              ease: "none",
              onUpdate: () => {
                const dx = Math.sin(drift.p) * 4;
                const dy = Math.sin(drift.p * 1.3) * 2;
                camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
              },
            },
            0,
          );

          // Title fades/slides in and holds
          tl.to("#a1-title", { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 3.9);

          window.__timelines["act1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
