<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0f0d;
        --ink: #f4efe6;
        --ink-soft: rgba(244, 239, 230, 0.78);
        --font-display: "EB Garamond", serif;
        --font-label: "IBM Plex Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      .shot, #endcard { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <video id="s01" class="clip shot" src="assets/shots/s01.mp4" data-start="0.000" data-duration="2.000" data-track-index="0" muted playsinline></video>
      <video id="s02" class="clip shot" src="assets/shots/s02.mp4" data-start="2.000" data-duration="1.000" data-track-index="1" muted playsinline></video>
      <video id="s03" class="clip shot" src="assets/shots/s03.mp4" data-start="3.000" data-duration="1.000" data-track-index="0" muted playsinline></video>
      <video id="s04" class="clip shot" src="assets/shots/s04.mp4" data-start="4.000" data-duration="1.000" data-track-index="1" muted playsinline></video>
      <video id="s05" class="clip shot" src="assets/shots/s05.mp4" data-start="5.000" data-duration="0.500" data-track-index="0" muted playsinline></video>
      <video id="s06" class="clip shot" src="assets/shots/s06.mp4" data-start="5.500" data-duration="1.000" data-track-index="1" muted playsinline></video>
      <video id="s07" class="clip shot" src="assets/shots/s07.mp4" data-start="6.500" data-duration="0.500" data-track-index="0" muted playsinline></video>
      <video id="s08" class="clip shot" src="assets/shots/s08.mp4" data-start="7.000" data-duration="1.000" data-track-index="1" muted playsinline></video>
      <video id="s09" class="clip shot" src="assets/shots/s09.mp4" data-start="8.000" data-duration="1.000" data-track-index="0" muted playsinline></video>
      <video id="s10" class="clip shot" src="assets/shots/s10.mp4" data-start="9.000" data-duration="0.500" data-track-index="1" muted playsinline></video>
      <video id="s11" class="clip shot" src="assets/shots/s11.mp4" data-start="9.500" data-duration="1.500" data-track-index="0" muted playsinline></video>
      <video id="s12" class="clip shot" src="assets/shots/s12.mp4" data-start="11.000" data-duration="0.500" data-track-index="1" muted playsinline></video>
      <video id="s13" class="clip shot" src="assets/shots/s13.mp4" data-start="11.500" data-duration="1.000" data-track-index="0" muted playsinline></video>
      <video id="s14" class="clip shot" src="assets/shots/s14.mp4" data-start="12.500" data-duration="1.000" data-track-index="1" muted playsinline></video>
      <video id="s15" class="clip shot" src="assets/shots/s15.mp4" data-start="13.500" data-duration="0.500" data-track-index="0" muted playsinline></video>
      <video id="s16" class="clip shot" src="assets/shots/s16.mp4" data-start="14.000" data-duration="1.000" data-track-index="1" muted playsinline></video>
      <video id="s17" class="clip shot" src="assets/shots/s17.mp4" data-start="15.000" data-duration="1.000" data-track-index="0" muted playsinline></video>
      <video id="s18" class="clip shot" src="assets/shots/s18.mp4" data-start="16.000" data-duration="1.000" data-track-index="1" muted playsinline></video>
      <video id="s19" class="clip shot" src="assets/shots/s19.mp4" data-start="17.000" data-duration="0.500" data-track-index="0" muted playsinline></video>

      <video id="endcard" class="clip" src="assets/shots/endcard.mp4" data-start="20.000" data-duration="5.000" data-track-index="2" muted playsinline></video>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="4" data-track-index="3" data-track-kind="graphics" style="position:absolute;inset:0;z-index:6"></div>
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="25" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
