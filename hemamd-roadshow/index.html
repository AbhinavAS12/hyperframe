<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      #hotel,
      #dubai {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        object-fit: cover;
      }
      #hotel-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 40%;
        transform-origin: 52% 30%;
      }
      #captions {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.46"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="footage"
        class="clip"
        src="assets/video/roadshow.mp4"
        data-start="0"
        data-duration="29.46"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1.3"
        playsinline
      ></video>

      <!-- Hotel cutaway while he names the Ritz-Carlton, Bengaluru: enhanced photo with a slow push-in -->
      <div
        id="hotel"
        class="clip"
        data-start="2.10"
        data-duration="1.94"
        data-track-index="3"
      >
        <img id="hotel-img" src="assets/images/ritz-carlton-bengaluru.jpg" alt="The Ritz-Carlton, Bengaluru" />
      </div>

      <!-- Dubai B-roll under "business setup opportunities in Dubai" -->
      <video
        id="dubai"
        class="clip"
        src="assets/video/dubai-broll.mp4"
        data-start="16.20"
        data-duration="3.00"
        data-media-start="0"
        data-track-index="3"
        muted
        playsinline
      ></video>

      <div
        id="captions"
        class="clip"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="29.46"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio
        id="bgm"
        src="assets/music/bgm.mp3"
        data-start="0"
        data-duration="29.46"
        data-track-index="2"
        data-volume="0.16"
        data-fade-in="0.4"
        data-fade-out="1.6"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Optical-zoom push-in on the hotel photo across its whole cutaway.
      tl.fromTo(
        "#hotel-img",
        { scale: 1.0 },
        { scale: 1.16, duration: 1.94, ease: "power1.inOut" },
        2.1,
      );
      tl.set({}, {}, 29.46);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
