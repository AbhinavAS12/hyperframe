<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      #captions {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29.46"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="footage"
        class="clip"
        src="assets/video/roadshow.mp4"
        data-start="0"
        data-duration="29.46"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1.3"
        playsinline
      ></video>

      <div
        id="captions"
        class="clip"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="29.46"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio
        id="bgm"
        src="assets/music/bgm.mp3"
        data-start="0"
        data-duration="29.46"
        data-track-index="2"
        data-volume="0.16"
        data-fade-in="0.4"
        data-fade-out="1.6"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 29.46);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
