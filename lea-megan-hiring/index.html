<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      #captions {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.5"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="footage"
        class="clip"
        src="assets/video/lea-megan.mp4"
        data-start="0"
        data-duration="40.5"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <div
        id="captions"
        class="clip"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="40.5"
        data-track-index="1"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>
      <audio
        id="music"
        class="clip"
        src="assets/bgm/five-seven-move-1.mp3"
        data-start="0"
        data-duration="40.5"
        data-media-start="9.05"
        data-track-index="2"
        data-fade-out="1.2"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.12},{"t":5.0,"v":0.12},{"t":5.2,"v":0.075},{"t":35.5,"v":0.075},{"t":36.3,"v":0.36},{"t":40.5,"v":0.36}]}]}'
      ></audio>
      <!--SFX-->

      <!--/SFX-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
