<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #main-video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: contain;
        z-index: 1;
      }
      #outro {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="58.21"
      data-width="1080"
      data-height="1920"
    >
      <!-- Source edit, trimmed at 53.25s: the last line ("UNIT allocation begins.") is fully spoken,
           and the source's own fade-to-black — where that caption lingered on screen — is cut off. -->
      <video
        id="main-video"
        class="clip"
        src="assets/footage/zukhri-massar.mp4"
        data-start="0"
        data-duration="53.25"
        data-track-index="0"
        data-has-audio="true"
        data-volume="1"
        data-fade-out="0.15"
        playsinline
      ></video>

      <!-- Allegiance brand outro (General_QR_A-Outro, 5.16s, silent; scaled from 2160x3840) -->
      <video
        id="outro"
        class="clip"
        src="assets/brand/allegiance-outro-qr.mp4"
        data-start="53.05"
        data-duration="5.16"
        data-track-index="1"
        muted
        playsinline
      ></video>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Dissolve from the last spoken frame into the outro
      tl.fromTo("#outro", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.inOut" }, 53.05);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
