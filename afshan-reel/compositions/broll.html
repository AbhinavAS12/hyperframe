  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Each shot punches in (scale 1.14 -> 1.0, fade 0.2s) then drifts slowly, like the reference.
    // [img, start, duration, xFrom, xTo, yFrom, yTo, scaleEnd]
    const shots = [
      ["#br-aerial-img", 4.93, 3.67, -1250, -1720, 0, 0, 1.06],
      ["#br-masterplan-img", 10.26, 3.89, -250, -720, 0, 0, 1.08],
      ["#br-towers-img", 14.15, 2.05, 0, 0, -1300, -620, 1.04],
      ["#br-office-img", 17.6, 2.5, -1050, -1450, -580, -580, 1.05],
      ["#br-rooftop-img", 20.1, 1.05, -760, -950, 0, 0, 1.04],
      ["#br-park-img", 21.15, 2.15, -300, -620, 0, 0, 1.05],
      ["#br-boulevard-img", 26.8, 2.6, -850, -1150, 0, 0, 1.08],
    ];
    shots.forEach(([sel, start, dur, x0, x1, y0, y1, s1]) => {
      const punch = sel.replace("-img", "-punch");
      // Punch-in zoom; opacity snaps in fast so a source cut underneath never peeks through.
      tl.fromTo(punch, { scale: 1.14 }, { scale: 1, duration: 0.45, ease: "expo.out" }, start);
      tl.fromTo(punch, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, start);
      tl.fromTo(
        sel,
        { x: x0, y: y0, scale: 1 },
        { x: x1, y: y1, scale: s1, duration: dur, ease: "sine.inOut" },
        start,
      );
    });

    window.__timelines["broll"] = tl;
  </script>
