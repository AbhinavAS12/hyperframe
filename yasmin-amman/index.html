<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
      #cards { position: absolute; inset: 0; z-index: 4; }
      #captions { position: absolute; inset: 0; z-index: 5; }
      #outro { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 9; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31.35" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="assets/video/yasmine.mp4" data-start="0" data-duration="26.43" data-track-index="0" data-has-audio="true" playsinline></video>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="26.43" data-track-index="1" data-track-kind="captions" data-width="1080" data-height="1920"></div>


      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html"
        data-start="0" data-duration="26.43" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <video id="outro" class="clip" src="assets/video/allegiance-outro.mp4" data-start="26.2" data-duration="5.15" data-track-index="6" muted playsinline></video>

      <audio id="bgm" src="assets/audio/bgm.mp3" data-start="0" data-duration="31.34" data-track-index="3" data-volume="0.28"></audio>
      <audio id="sfx-blur1" src="assets/audio/whoosh-short.mp3" data-start="7.82" data-duration="0.57" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-blur2" src="assets/audio/whoosh-short.mp3" data-start="16.05" data-duration="0.57" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-pop1" src="assets/audio/pop.mp3" data-start="3.5" data-duration="0.72" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-pop2" src="assets/audio/pop.mp3" data-start="10.02" data-duration="0.72" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-pop3" src="assets/audio/pop.mp3" data-start="14.25" data-duration="0.72" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-pop4" src="assets/audio/pop.mp3" data-start="21.92" data-duration="0.72" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-pop5" src="assets/audio/pop.mp3" data-start="24.15" data-duration="0.72" data-track-index="5" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Slow optical push-in on the last shot (cut at 16.3s), centred on the speaker
      tl.fromTo("#footage", { scale: 1 }, { scale: 1.15, transformOrigin: "50% 30%", duration: 26.43 - 16.3, ease: "none", immediateRender: false }, 16.3);
      tl.fromTo("#outro", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.inOut" }, 26.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
