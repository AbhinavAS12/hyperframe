<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #edit,
      #patch,
      #patch-swiss,
      #outro {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #edit {
        z-index: 1;
      }
      #patch,
      #patch-swiss {
        z-index: 2;
      }
      #outro {
        z-index: 3;
      }
      #flag {
        position: absolute;
        left: 435px;
        top: 1142px;
        z-index: 4;
        width: 210px;
        height: 113px;
        border-radius: 18px;
        object-fit: cover;
        box-shadow:
          0 6px 18px rgba(0, 0, 0, 0.35),
          0 2px 4px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.27"
      data-width="1080"
      data-height="1920"
    >
      <!-- Final 3 edit as delivered: captions, music and SFX already in it -->
      <video
        id="edit"
        class="clip"
        src="assets/video/lea-megan-final3.mp4"
        data-start="0"
        data-duration="35.1"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <!-- Picture-only patch: "Swiss" caption re-rendered with a soft white glow
           instead of the dark shadow; audio underneath untouched -->
      <video
        id="patch-swiss"
        class="clip"
        src="assets/video/caption-patch-swiss.mp4"
        data-start="0.1"
        data-duration="1.12"
        data-media-start="0.1"
        data-track-index="5"
        muted
        playsinline
      ></video>
      <!-- Picture-only patch: same frames re-rendered with "relationships," (comma)
           for that one caption; Final 3's audio underneath is untouched -->
      <video
        id="patch"
        class="clip"
        src="assets/video/caption-patch.mp4"
        data-start="13.7"
        data-duration="2.25"
        data-media-start="13.7"
        data-track-index="3"
        muted
        playsinline
      ></video>
      <!-- Swiss flag under "We're Swiss": pops in on "Swiss", leaves with the caption -->
      <img
        id="flag"
        class="clip"
        src="assets/images/swiss-flag.png"
        alt="Swiss flag"
        data-start="0.5"
        data-duration="0.72"
        data-track-index="4"
      />
      <!-- Allegiance outro with QR (from the HR Secondary reel), fades up from black -->
      <video
        id="outro"
        class="clip"
        src="assets/video/allegiance-outro.mp4"
        data-start="35.1"
        data-duration="5.166"
        data-track-index="1"
        muted
        playsinline
      ></video>
      <!-- Music continuation: same track, sample-aligned with the bed baked into
           Final 3 (media 9.05s at t=0). Its linear 1.5s fade-in mirrors the baked
           1.5s fade-out, so the bed carries on unbroken, lifts under the logo,
           then fades out by the end of the outro. -->
      <audio
        id="music-outro"
        class="clip"
        src="assets/bgm/five-seven-move-1.mp3"
        data-start="33.58"
        data-duration="6.69"
        data-media-start="42.63"
        data-track-index="2"
        data-fade-in="1.5"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.075},{"t":1.5,"v":0.075},{"t":2.1,"v":0.3},{"t":3.3,"v":0.3},{"t":6.69,"v":0,"curve":0.3}]}]}'
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#flag",
        { opacity: 0, scale: 0.6, y: 18 },
        { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(1.8)" },
        0.56,
      );
      tl.to("#flag", { opacity: 0, duration: 0.14, ease: "power2.in" }, 1.08);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
