<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #edit,
      #outro {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #edit {
        z-index: 1;
      }
      #outro {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.27"
      data-width="1080"
      data-height="1920"
    >
      <!-- Final 3 edit as delivered: captions, music and SFX already in it -->
      <video
        id="edit"
        class="clip"
        src="assets/video/lea-megan-final3.mp4"
        data-start="0"
        data-duration="35.1"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <!-- Allegiance outro with QR (from the HR Secondary reel), fades up from black -->
      <video
        id="outro"
        class="clip"
        src="assets/video/allegiance-outro.mp4"
        data-start="35.1"
        data-duration="5.166"
        data-track-index="1"
        muted
        playsinline
      ></video>
      <!-- Music continuation: same track, sample-aligned with the bed baked into
           Final 3 (media 9.05s at t=0). Its linear 1.5s fade-in mirrors the baked
           1.5s fade-out, so the bed carries on unbroken, lifts under the logo,
           then fades out by the end of the outro. -->
      <audio
        id="music-outro"
        class="clip"
        src="assets/bgm/five-seven-move-1.mp3"
        data-start="33.58"
        data-duration="6.69"
        data-media-start="42.63"
        data-track-index="2"
        data-fade-in="1.5"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.075},{"t":1.5,"v":0.075},{"t":2.1,"v":0.3},{"t":3.3,"v":0.3},{"t":6.69,"v":0,"curve":0.3}]}]}'
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
