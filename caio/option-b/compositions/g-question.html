<!DOCTYPE html>
<html lang="pt-BR">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; background:#081024; font-family:"Inter", sans-serif; color:#f7f3ea; }

        #g-question-stage { position:absolute; inset:0; }
        #g-question-bg3d { position:absolute; inset:0; width:1080px; height:1920px; }
        #g-question-vig { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 38%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
        #g-question-ring { position:absolute; left:402px; top:142px; width:276px; height:276px;
                    border-radius:50%; border:3px solid #d4af6a; box-shadow:0 0 40px rgba(212,175,106,.35); }
    
        #root .qwrap { position:absolute; top:600px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:24px; }
        #root .qm { font:900 400px/1 "Playfair Display", serif; color:#d4af6a;
                    text-shadow: 6px 10px 0 rgba(0,0,0,.45), 0 0 60px #d4af6a55; }
        #root .l1 { font:700 56px "Inter"; color:#f7f3ea; }
        #root .l2 { font:900 130px/1 "Playfair Display"; color:#d4af6a; font-style:italic; }
    
      </style>
      <div id="root" data-composition-id="g-question" data-width="1080" data-height="1920">
        <canvas id="g-question-bg3d" width="1080" height="1920"></canvas><div id="g-question-vig"></div><div id="g-question-ring"></div>
        <div id="g-question-stage">
          <div class="qwrap">
            <div id="q-mark" class="qm">?</div>
            <div class="qt"><div id="q-l1" class="l1">Por que investir</div><div id="q-l2" class="l2">aqui?</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#g-question-stage", { clipPath:"circle(0% at 540px 280px)" }, { clipPath:"circle(150% at 540px 280px)", duration:0.55, ease:"power3.inOut" }, 0);
          tl.to("#g-question-stage", { opacity:0, duration:0.22, ease:"power2.in" }, 1.610);
          const bg = window.CaioFX.goldField(document.getElementById("g-question-bg3d"), 1036);
          const st = { t:0 };
          tl.fromTo(st, { t:0 }, { t:1.850, duration:1.850, ease:"none", onUpdate:() => bg(st.t) }, 0);
          bg(0);
        
          tl.fromTo("#q-mark", { scale:0.2, rotation:-25, opacity:0 }, { scale:1, rotation:-8, opacity:1, duration:0.55, ease:"back.out(1.8)" }, 0.05);
          tl.fromTo("#q-l1", { opacity:0, filter:"blur(8px)" }, { opacity:1, filter:"blur(0px)", duration:0.2 }, 0.2);
          tl.fromTo("#q-l2", { opacity:0, scale:1.3, filter:"blur(10px)" }, { opacity:1, scale:1, filter:"blur(0px)", duration:0.3, ease:"expo.out" }, 0.75);
    
          window.__timelines["g-question"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
