<!DOCTYPE html>
<html lang="pt-BR">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; background:#081024; font-family:"Inter", sans-serif; color:#f7f3ea; }

        #g-brand-stage { position:absolute; inset:0; }
        #g-brand-bg3d { position:absolute; inset:0; width:1080px; height:1920px; }
        #g-brand-vig { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 38%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
        #g-brand-ring { position:absolute; left:402px; top:142px; width:276px; height:276px;
                    border-radius:50%; border:3px solid #d4af6a; box-shadow:0 0 40px rgba(212,175,106,.35); }
    
        #root .brand { position:absolute; top:700px; left:0; right:0; text-align:center; }
        #root .q { font:600 48px "Inter"; color:rgba(247,243,234,.66); }
        #root .word { margin-top:18px; font:700 112px/1 "Playfair Display"; letter-spacing:10px; color:#d4af6a; }
        #root .lt { display:inline-block; }
        #root .line { width:520px; height:4px; margin:34px auto 0; background:#d4af6a; transform-origin:50% 50%; }
        #root .tag { margin-top:26px; font:600 40px "Inter"; }
    
      </style>
      <div id="root" data-composition-id="g-brand" data-width="1080" data-height="1920">
        <canvas id="g-brand-bg3d" width="1080" height="1920"></canvas><div id="g-brand-vig"></div><div id="g-brand-ring"></div>
        <div id="g-brand-stage">
          <div class="brand">
            <div id="br-q" class="q">Por que escolher a</div>
            <div id="br-word" class="word"><span class="lt">A</span><span class="lt">L</span><span class="lt">L</span><span class="lt">E</span><span class="lt">G</span><span class="lt">I</span><span class="lt">A</span><span class="lt">N</span><span class="lt">C</span><span class="lt">E</span></div>
            <div id="br-line" class="line"></div>
            <div id="br-tag" class="tag">Consultoria global de investimentos</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#g-brand-stage", { clipPath:"circle(0% at 540px 280px)" }, { clipPath:"circle(150% at 540px 280px)", duration:0.55, ease:"power3.inOut" }, 0);
          tl.to("#g-brand-stage", { opacity:0, duration:0.22, ease:"power2.in" }, 2.110);
          const bg = window.CaioFX.goldField(document.getElementById("g-brand-bg3d"), 667);
          const st = { t:0 };
          tl.fromTo(st, { t:0 }, { t:2.350, duration:2.350, ease:"none", onUpdate:() => bg(st.t) }, 0);
          bg(0);
        
          tl.fromTo("#br-q", { opacity:0, y:20 }, { opacity:1, y:0, duration:0.35, ease:"expo.out" }, 0.05);
          tl.fromTo("#br-word .lt", { opacity:0.0, y:40, filter:"blur(8px)" }, { opacity:1, y:0, filter:"blur(0px)", duration:0.4, ease:"expo.out", stagger:0.05 }, 0.45);
          tl.fromTo("#br-line", { scaleX:0 }, { scaleX:1, duration:0.6, ease:"power3.inOut" }, 0.9);
          tl.fromTo("#br-tag", { opacity:0 }, { opacity:1, duration:0.4 }, 1.2);
    
          window.__timelines["g-brand"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
