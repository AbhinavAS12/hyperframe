      <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
        <div id="cap0" class="clip cap" data-start="0.020" data-duration="2.483" data-track-index="0"><div class="ct">Em 1994, um real valia um dólar.</div></div>
        <div id="cap1" class="clip cap" data-start="2.553" data-duration="1.117" data-track-index="0"><div class="ct">E olha o que aconteceu desde então.</div></div>
        <div id="cap2" class="clip cap" data-start="3.720" data-duration="0.552" data-track-index="0"><div class="ct">Nas últimas semanas,</div></div>
        <div id="cap3" class="clip cap" data-start="4.332" data-duration="1.938" data-track-index="0"><div class="ct">o real foi a moeda que mais perdeu valor no mundo.</div></div>
        <div id="cap4" class="clip cap" data-start="6.320" data-duration="1.444" data-track-index="0"><div class="ct">Os juros do Brasil estão entre os mais altos</div></div>
        <div id="cap5" class="clip cap" data-start="7.824" data-duration="1.094" data-track-index="0"><div class="ct">do planeta e o mercado já espera</div></div>
        <div id="cap6" class="clip cap" data-start="8.978" data-duration="1.326" data-track-index="0"><div class="ct">juros ainda maiores em 2027.</div></div>
        <div id="cap7" class="clip cap" data-start="10.353" data-duration="1.217" data-track-index="0"><div class="ct">A dívida do país não para de subir,</div></div>
        <div id="cap8" class="clip cap" data-start="11.620" data-duration="1.613" data-track-index="0"><div class="ct">os dividendos voltaram a ser tributados e a reforma</div></div>
        <div id="cap9" class="clip cap" data-start="13.293" data-duration="1.910" data-track-index="0"><div class="ct">vai mudar as regras continuamente até 2033.</div></div>
        <div id="cap10" class="clip cap" data-start="15.253" data-duration="0.813" data-track-index="0"><div class="ct">Quem vende imóvel com lucro,</div></div>
        <div id="cap11" class="clip cap" data-start="16.126" data-duration="1.744" data-track-index="0"><div class="ct">paga até vinte e dois e meio por cento de imposto.</div></div>
        <div id="cap12" class="clip cap" data-start="17.920" data-duration="1.398" data-track-index="0"><div class="ct">O dinheiro estrangeiro tá saindo e quem tem capital</div></div>
        <div id="cap13" class="clip cap" data-start="19.378" data-duration="0.986" data-track-index="0"><div class="ct">no Brasil está buscando formas</div></div>
        <div id="cap14" class="clip cap" data-start="20.424" data-duration="0.913" data-track-index="0"><div class="ct">de proteger o patrimônio.</div></div>
        <div id="cap15" class="clip cap" data-start="21.387" data-duration="1.798" data-track-index="0"><div class="ct">E tudo isso somado à violência e à insegurança,</div></div>
        <div id="cap16" class="clip cap" data-start="23.244" data-duration="1.186" data-track-index="0"><div class="ct">que fazem parte da rotina de quem</div></div>
        <div id="cap17" class="clip cap" data-start="24.491" data-duration="0.813" data-track-index="0"><div class="ct">tem patrimônio no Brasil hoje.</div></div>
        <div id="cap18" class="clip cap" data-start="25.353" data-duration="1.259" data-track-index="0"><div class="ct">Quem tem patrimônio e entende que o futuro é incerto,</div></div>
        <div id="cap19" class="clip cap" data-start="26.673" data-duration="1.125" data-track-index="0"><div class="ct">já percebeu: não dá pra deixar tudo</div></div>
        <div id="cap20" class="clip cap" data-start="27.857" data-duration="1.213" data-track-index="0"><div class="ct">exposto aos riscos de uma única moeda.</div></div>
        <div id="cap21" class="clip cap" data-start="29.920" data-duration="0.552" data-track-index="0"><div class="ct">Aqui nos Emirados Árabes,</div></div>
        <div id="cap22" class="clip cap" data-start="30.532" data-duration="0.694" data-track-index="0"><div class="ct">a economia é estável</div></div>
        <div id="cap23" class="clip cap" data-start="31.285" data-duration="1.051" data-track-index="0"><div class="ct">e entre as que mais crescem no mundo.</div></div>
        <div id="cap24" class="clip cap" data-start="32.387" data-duration="0.717" data-track-index="0"><div class="ct">A moeda é atrelada ao dólar,</div></div>
        <div id="cap25" class="clip cap" data-start="33.153" data-duration="0.921" data-track-index="0"><div class="ct">não há imposto sobre aluguel,</div></div>
        <div id="cap26" class="clip cap" data-start="34.134" data-duration="0.736" data-track-index="0"><div class="ct">nem sobre o ganho de capital</div></div>
        <div id="cap27" class="clip cap" data-start="34.920" data-duration="1.475" data-track-index="0"><div class="ct">e a segurança está entre as maiores do planeta,</div></div>
        <div id="cap28" class="clip cap" data-start="36.455" data-duration="1.325" data-track-index="0"><div class="ct">num ambiente feito pra receber o investimento</div></div>
        <div id="cap29" class="clip cap" data-start="37.839" data-duration="1.331" data-track-index="0"><div class="ct">estrangeiro com segurança e facilidade.</div></div>
        <div id="cap30" class="clip cap" data-start="39.220" data-duration="0.936" data-track-index="0"><div class="ct">Não é sobre sair do Brasil,</div></div>
        <div id="cap31" class="clip cap" data-start="40.216" data-duration="0.955" data-track-index="0"><div class="ct">é sobre proteger o que você</div></div>
        <div id="cap32" class="clip cap" data-start="41.232" data-duration="1.105" data-track-index="0"><div class="ct">construiu com tanta dedicação.</div></div>
        <div id="cap33" class="clip cap" data-start="42.387" data-duration="1.275" data-track-index="0"><div class="ct">Eu me chamo Caio Rezende, eu sou advogado e consultor</div></div>
        <div id="cap34" class="clip cap" data-start="43.721" data-duration="1.278" data-track-index="0"><div class="ct">imobiliário com mais de dez anos de experiência</div></div>
        <div id="cap35" class="clip cap" data-start="45.060" data-duration="1.077" data-track-index="0"><div class="ct">em transações de alto valor em São Paulo.</div></div>
        <div id="cap36" class="clip cap" data-start="46.187" data-duration="1.428" data-track-index="0"><div class="ct">Hoje, eu assessoro brasileiros que buscam</div></div>
        <div id="cap37" class="clip cap" data-start="47.675" data-duration="0.863" data-track-index="0"><div class="ct">internacionalizar o patrimônio</div></div>
        <div id="cap38" class="clip cap" data-start="48.598" data-duration="1.172" data-track-index="0"><div class="ct">nos Emirados Árabes por meio da</div></div>
        <div id="cap39" class="clip cap" data-start="49.820" data-duration="1.250" data-track-index="0"><div class="ct">Allegiance, uma consultoria global</div></div>
        <div id="cap40" class="clip cap" data-start="51.120" data-duration="1.150" data-track-index="0"><div class="ct">com sete escritórios internacionais,</div></div>
        <div id="cap41" class="clip cap" data-start="52.320" data-duration="1.383" data-track-index="0"><div class="ct">reconhecida pela excelência e atendimento</div></div>
        <div id="cap42" class="clip cap" data-start="53.753" data-duration="0.967" data-track-index="0"><div class="ct">e registrada no órgão regulador</div></div>
        <div id="cap43" class="clip cap" data-start="54.780" data-duration="1.190" data-track-index="0"><div class="ct">imobiliário de Dubai, o RERA.</div></div>
        <div id="cap44" class="clip cap" data-start="56.020" data-duration="0.767" data-track-index="0"><div class="ct">Se você busca alternativas</div></div>
        <div id="cap45" class="clip cap" data-start="56.847" data-duration="0.990" data-track-index="0"><div class="ct">pra proteger o seu patrimônio,</div></div>
        <div id="cap46" class="clip cap" data-start="57.887" data-duration="0.844" data-track-index="0"><div class="ct">agende uma consulta inicial</div></div>
        <div id="cap47" class="clip cap" data-start="58.791" data-duration="1.279" data-track-index="0"><div class="ct">comigo como cortesia da Allegiance</div></div>
