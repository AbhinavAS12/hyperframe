        <div id="cap1" class="clip cap" data-start="3.320" data-duration="1.450" data-track-index="0"><div class="ct">E olha o que aconteceu desde então.</div></div>

        <div id="cap4" class="clip cap" data-start="8.187" data-duration="1.910" data-track-index="0"><div class="ct">Os juros do Brasil estão entre os mais altos</div></div>
