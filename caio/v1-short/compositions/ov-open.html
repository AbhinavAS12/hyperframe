<!DOCTYPE html>
<html lang="pt-BR">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>

        @font-face { font-family:"Cormorant Garamond"; font-weight:600; src:url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
        @font-face { font-family:"Cormorant Garamond"; font-weight:500; src:url("assets/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); }

        #root { position:absolute; inset:0; overflow:hidden; color:#F5F0E6; font-family:"Montserrat", sans-serif; font-weight:500; }

        #root .clip { position:absolute; inset:0; }
        #root .hkdim { position:absolute; inset:0; background:linear-gradient(180deg, #07150Fb3 0%, #07150F66 35%, #07150Fd9 100%); }
        #root .hkn { position:absolute; left:0; right:0; top:500px; text-align:center; font:600 300px/1 "Cormorant Garamond", serif; color:#C9A86A; letter-spacing:-6px; }
        #root .hkl { position:absolute; left:0; right:0; top:860px; text-align:center; font:500 40px/1.3 "Montserrat", sans-serif; color:#F5F0E6; }
        #root .src { position:absolute; left:110px; font:500 20px "Montserrat", sans-serif; color:#F5F0E6; opacity:.6; }
        #root .hks { top:1290px; }
        #root .chin { position:absolute; inset:0; background:#0B2B22; }
        #root .kick { position:absolute; left:110px; top:330px; font:500 24px "Montserrat", sans-serif; letter-spacing:5px; color:#C9A86A; }
        #root .chh { position:absolute; left:110px; right:110px; top:380px; font:600 78px/1.1 "Cormorant Garamond", serif; color:#F5F0E6; }
        #root .bars { position:absolute; left:130px; right:130px; top:640px; height:620px; display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #C9A86A55; }
        #root .col { width:220px; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative; }
        #root .bar { width:170px; transform-origin:50% 100%; }
        #root .val { font:600 72px/1 "Cormorant Garamond", serif; margin-bottom:14px; }
        #root .lab { position:absolute; bottom:-52px; font:500 28px "Montserrat", sans-serif; }
        #root .chs { top:1330px; }
    
      </style>
      <div id="root" data-composition-id="ov-open" data-width="1080" data-height="1920">

        <div id="hk" class="clip" data-start="0" data-duration="2.000" data-track-index="0">
          <div class="hkdim"></div>
          <div id="hk-n" class="hkn">7,7%</div>
          <div id="hk-l" class="hkl">Crescimento projetado<br>dos Emirados em 2027</div>
          <div class="src hks">Fonte: FMI, World Economic Outlook, out. 2026</div>
        </div>
        <div id="ch" class="clip" data-start="1.800" data-duration="6.933" data-track-index="1">
          <div id="ch-in" class="chin">
            <div id="ch-k" class="kick">PROJEÇÃO DE CRESCIMENTO 2027</div>
            <div id="ch-h" class="chh">Os Emirados devem crescer 4× mais que o Brasil</div>
            <div class="bars" data-layout-allow-overflow><div class="col"><div class="val" id="cv0" style="color:#F5F0E699">0,0%</div><div class="bar" id="cb0" style="height:116px;background:#5A6670"></div><div class="lab" style="color:#F5F0E6">Brasil</div></div><div class="col"><div class="val" id="cv1" style="color:#F5F0E6">0,0%</div><div class="bar" id="cb1" style="height:195px;background:#DCD3C6"></div><div class="lab" style="color:#F5F0E6">Mundo</div></div><div class="col"><div class="val" id="cv2" style="color:#C9A86A">0,0%</div><div class="bar" id="cb2" style="height:470px;background:#C9A86A"></div><div class="lab" style="color:#C9A86A">Emirados</div></div></div>
            <div class="src chs">Fonte: FMI, World Economic Outlook, out. 2026</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#hk-n",{opacity:0,y:12},{opacity:1,y:0,duration:0.27,ease:"power2.out"},0.050);
          tl.fromTo("#hk-l",{opacity:0,y:12},{opacity:1,y:0,duration:0.27,ease:"power2.out"},0.250);
          tl.fromTo("#hk .src",{opacity:0},{opacity:0.6,duration:0.3},0.35);
          tl.fromTo("#ch-in",{opacity:0},{opacity:1,duration:0.2,ease:"none"},1.800);
          tl.fromTo("#ch-k",{opacity:0,y:12},{opacity:1,y:0,duration:0.27,ease:"power2.out"},1.900);
          tl.fromTo("#ch-h",{opacity:0,y:12},{opacity:1,y:0,duration:0.27,ease:"power2.out"},2.000);
          tl.fromTo("#cb0",{scaleY:0},{scaleY:1,duration:1.0,ease:"power3.out"},7.610);
          tl.fromTo("#cv0",{opacity:0,y:12},{opacity:1,y:0,duration:0.27,ease:"power2.out"},7.610);
          (function(){const o={v:0},e=document.getElementById("cv0");tl.fromTo(o,{v:0},{v:1.9,duration:1.0,ease:"power3.out",onUpdate:()=>{e.textContent=o.v.toFixed(1).replace(".",",")+"%";}},7.610);})();
          tl.fromTo("#cb1",{scaleY:0},{scaleY:1,duration:1.0,ease:"power3.out"},3.992);
          tl.fromTo("#cv1",{opacity:0,y:12},{opacity:1,y:0,duration:0.27,ease:"power2.out"},3.992);
          (function(){const o={v:0},e=document.getElementById("cv1");tl.fromTo(o,{v:0},{v:3.2,duration:1.0,ease:"power3.out",onUpdate:()=>{e.textContent=o.v.toFixed(1).replace(".",",")+"%";}},3.992);})();
          tl.fromTo("#cb2",{scaleY:0},{scaleY:1,duration:1.0,ease:"power3.out"},1.950);
          tl.fromTo("#cv2",{opacity:0,y:12},{opacity:1,y:0,duration:0.27,ease:"power2.out"},1.950);
          (function(){const o={v:0},e=document.getElementById("cv2");tl.fromTo(o,{v:0},{v:7.7,duration:1.0,ease:"power3.out",onUpdate:()=>{e.textContent=o.v.toFixed(1).replace(".",",")+"%";}},1.950);})();
          window.__timelines["ov-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
