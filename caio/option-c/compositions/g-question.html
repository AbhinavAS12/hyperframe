<!DOCTYPE html>
<html lang="pt-BR">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; background:#07090d; font-family:"Montserrat", sans-serif; color:#ffffff; }

        #g-question-stage { position:absolute; inset:0; }
        #g-question-bg3d { position:absolute; inset:0; width:1080px; height:1920px; }
        #g-question-vig { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 38%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
        #g-question-ring { position:absolute; left:402px; top:142px; width:276px; height:276px;
                    border-radius:50%; border:3px solid #2fd3f5; box-shadow:0 0 40px rgba(212,175,106,.35); }
    
        #root .qwrap { position:absolute; top:420px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:24px; }
        #root .qm { font:900 400px/1 "Montserrat", serif; color:#ff3b4f;
                    text-shadow: 6px 10px 0 rgba(0,0,0,.45), 0 0 60px #ff3b4f55; }
        #root .l1 { font:700 56px "Montserrat"; color:#ffffff; }
        #root .l2 { font:900 130px/1 "Montserrat"; color:#2fd3f5; font-style:normal; }
    
      </style>
      <div id="root" data-composition-id="g-question" data-width="1080" data-height="1920">
        <img id="g-question-bgimg" src="assets/bg-question.jpg" alt="" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;"><div id="g-question-bgdim" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,14,.55) 0%,rgba(4,8,14,.35) 45%,rgba(4,8,14,.75) 100%);"></div>
        <div id="g-question-glow" style="position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 40%, rgba(47,211,245,.10), rgba(0,0,0,0) 70%);"></div>
        <div id="g-question-stage">
          <div class="qwrap">
            <div id="q-mark" class="qm">?</div>
            <div class="qt"><div id="q-l1" class="l1">Por que investir</div><div id="q-l2" class="l2">aqui?</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#g-question-stage", { scale:1.18, filter:"blur(14px)", opacity:0 }, { scale:1, filter:"blur(0px)", opacity:1, duration:0.32, ease:"expo.out" }, 0);
          tl.to("#g-question-stage", { scale:0.94, filter:"blur(10px)", opacity:0, duration:0.18, ease:"power3.in" }, 1.650);
        
          tl.fromTo("#q-mark", { scale:0.2, rotation:-25, opacity:0 }, { scale:1, rotation:-8, opacity:1, duration:0.55, ease:"back.out(1.8)" }, 0.05);
          tl.fromTo("#q-l1", { opacity:0, filter:"blur(8px)" }, { opacity:1, filter:"blur(0px)", duration:0.2 }, 0.2);
          tl.fromTo("#q-l2", { opacity:0, scale:1.3, filter:"blur(10px)" }, { opacity:1, scale:1, filter:"blur(0px)", duration:0.3, ease:"expo.out" }, 0.75);
    
          tl.fromTo("#g-question-bgimg",{scale:1.1},{scale:1.0,duration:1.85,ease:"power1.out"},0);
          window.__timelines["g-question"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
