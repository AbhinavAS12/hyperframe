<!DOCTYPE html>
<html lang="pt-BR">
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        #root { position:absolute; inset:0; overflow:hidden; background:#07090d; font-family:"Montserrat", sans-serif; color:#ffffff; }

        #g-brand-stage { position:absolute; inset:0; }
        #g-brand-bg3d { position:absolute; inset:0; width:1080px; height:1920px; }
        #g-brand-vig { position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 38%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
        #g-brand-ring { position:absolute; left:402px; top:142px; width:276px; height:276px;
                    border-radius:50%; border:3px solid #2fd3f5; box-shadow:0 0 40px rgba(212,175,106,.35); }
    
        #root .brand { position:absolute; top:560px; left:0; right:0; text-align:center; }
        #root .q { font:600 48px "Montserrat"; color:rgba(255,255,255,.62); }
        #root .word { margin-top:18px; font:900 112px/1 "Montserrat"; letter-spacing:10px; color:#2fd3f5; }
        #root .lt { display:inline-block; }
        #root .line { width:520px; height:4px; margin:34px auto 0; background:#2fd3f5; transform-origin:50% 50%; }
        #root .tag { margin-top:26px; font:600 40px "Montserrat"; }
    
      </style>
      <div id="root" data-composition-id="g-brand" data-width="1080" data-height="1920">
        <img id="g-brand-bgimg" src="assets/bg-brand.jpg" alt="" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;"><div id="g-brand-bgdim" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,14,.55) 0%,rgba(4,8,14,.35) 45%,rgba(4,8,14,.75) 100%);"></div>
        <div id="g-brand-glow" style="position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 40%, rgba(47,211,245,.10), rgba(0,0,0,0) 70%);"></div>
        <div id="g-brand-stage">
          <div class="brand">
            <div id="br-q" class="q">Por que escolher a</div>
            <div id="br-word" class="word"><span class="lt">A</span><span class="lt">L</span><span class="lt">L</span><span class="lt">E</span><span class="lt">G</span><span class="lt">I</span><span class="lt">A</span><span class="lt">N</span><span class="lt">C</span><span class="lt">E</span></div>
            <div id="br-line" class="line"></div>
            <div id="br-tag" class="tag">Consultoria global de investimentos</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#g-brand-stage", { scale:1.18, filter:"blur(14px)", opacity:0 }, { scale:1, filter:"blur(0px)", opacity:1, duration:0.32, ease:"expo.out" }, 0);
          tl.to("#g-brand-stage", { scale:0.94, filter:"blur(10px)", opacity:0, duration:0.18, ease:"power3.in" }, 2.150);
        
          tl.fromTo("#br-q", { opacity:0, y:20 }, { opacity:1, y:0, duration:0.35, ease:"expo.out" }, 0.05);
          tl.fromTo("#br-word .lt", { opacity:0.0, y:40, filter:"blur(8px)" }, { opacity:1, y:0, filter:"blur(0px)", duration:0.4, ease:"expo.out", stagger:0.05 }, 0.45);
          tl.fromTo("#br-line", { scaleX:0 }, { scaleX:1, duration:0.6, ease:"power3.inOut" }, 0.9);
          tl.fromTo("#br-tag", { opacity:0 }, { opacity:1, duration:0.4 }, 1.2);
    
          tl.fromTo("#g-brand-bgimg",{scale:1.1},{scale:1.0,duration:2.35,ease:"power1.out"},0);
          window.__timelines["g-brand"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
