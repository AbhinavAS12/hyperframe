<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8">
    <title>Zukhri Arada CBD — Arabic captions</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Tajawal";
        font-weight: 800;
        src: url("assets/fonts/tajawal-arabic-800-normal.woff2") format("woff2");
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "Tajawal";
        font-weight: 800;
        src: url("assets/fonts/tajawal-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      body { margin: 0; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root .clip { position: absolute; inset: 0; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 45%; will-change: transform, filter; }
      #cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

      /* Captions — matched to the reference: bold white Tajawal, ~68px at 1080w,
         centred just above mid-frame, key words in yellow, soft drop shadow. */
      #subs { position: absolute; inset: 0; pointer-events: none; }
      .cue {
        position: absolute; left: 60px; right: 60px; top: 1000px;
        display: flex; justify-content: center; align-items: center; gap: 0 18px;
        flex-wrap: wrap; direction: rtl; opacity: 0;
        font-family: "Tajawal", sans-serif; font-weight: 800; font-size: 70px; line-height: 1.25;
        color: #fff; text-shadow: 0 3px 10px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .cue .w { display: inline-block; opacity: 0; transform-origin: 50% 60%; }
      .cue .w.hl { color: #ffe11a; }
      .cue .w.lat { font-size: 0.82em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="zukhri-arada" data-width="1080" data-height="1920" data-duration="40.5">
      <div id="cam">
        <video id="el-source" src="assets/source.mp4" data-start="0" data-duration="40.5" data-track-index="0" data-has-audio="true" playsinline></video>
      </div>
      <div id="flash" class="clip" data-start="0" data-duration="40.5" data-track-index="1"></div>
      <div id="subs" class="clip" data-start="0" data-duration="40.5" data-track-index="2"></div>
    </div>

    <script src="captions.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- Shot transitions: blur + brighten "flash" into the cut, sharpen out of it
      // (same feel as the reference's blur dissolve). Cut times from scene detection.
      const CUTS = [3.8, 14.733, 23.0, 33.4];
      CUTS.forEach((c) => {
        tl.fromTo("#cam",
          { filter: "blur(0px) brightness(1)", scale: 1 },
          { filter: "blur(22px) brightness(1.35)", scale: 1.07, duration: 0.18, ease: "power2.in", immediateRender: false }, c - 0.18);
        tl.fromTo("#cam",
          { filter: "blur(22px) brightness(1.35)", scale: 1.07 },
          { filter: "blur(0px) brightness(1)", scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, c);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.22, duration: 0.18, ease: "power2.in", immediateRender: false }, c - 0.18);
        tl.fromTo("#flash", { opacity: 0.22 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, c);
      });

      // ---- Arabic captions: words build one at a time inside short 1–3 word chunks.
      const subs = document.getElementById("subs");
      (window.CAPTIONS || []).forEach((cue, i) => {
        const el = document.createElement("div");
        el.className = "cue";
        el.id = "cue-" + i;
        cue.words.forEach((w, j) => {
          const s = document.createElement("span");
          s.className = "w" + (w.hl ? " hl" : "") + (/^[A-Za-z0-9]/.test(w.w) ? " lat" : "");
          s.id = `cue-${i}-w-${j}`;
          s.textContent = w.w;
          el.appendChild(s);
        });
        subs.appendChild(el);
        tl.set(el, { opacity: 1 }, cue.start);
        tl.set(el, { opacity: 0 }, cue.end);
        cue.words.forEach((w, j) => {
          tl.fromTo(`#cue-${i}-w-${j}`,
            { opacity: 0, scale: 1.18, y: 6 },
            { opacity: 1, scale: 1, y: 0, duration: 0.14, ease: "back.out(2)", immediateRender: false },
            Math.max(cue.start, w.t));
        });
      });

      tl.set({}, {}, 40.5);
      window.__timelines["zukhri-arada"] = tl;
    </script>
  </body>
</html>
