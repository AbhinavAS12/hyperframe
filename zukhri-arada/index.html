<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8">
    <title>Zukhri Arada CBD — Arabic captions</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Tajawal";
        font-weight: 800;
        src: url("assets/fonts/tajawal-arabic-800-normal.woff2") format("woff2");
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: "Tajawal";
        font-weight: 800;
        src: url("assets/fonts/tajawal-latin-800-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      body { margin: 0; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root .clip { position: absolute; inset: 0; }
      #stage { position: absolute; inset: 0; transform-origin: 50% 45%; will-change: transform, filter; }
      #cam { position: absolute; inset: 0; }
      .broll { overflow: hidden; background: #000; }
      .broll img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
      /* Soft shade behind the caption band so white/yellow words stay readable on bright renders. */
      .broll::after { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,0.38) 50%, rgba(0,0,0,0.38) 60%, rgba(0,0,0,0) 72%); }
      #cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

      /* Captions — matched to the reference: bold white Tajawal, ~68px at 1080w,
         centred just above mid-frame, key words in yellow, soft drop shadow. */
      #subs { position: absolute; inset: 0; pointer-events: none; }
      .cue {
        position: absolute; left: 60px; right: 60px; top: 1000px;
        display: flex; justify-content: center; align-items: center; gap: 0 18px;
        flex-wrap: wrap; direction: rtl; opacity: 0;
        font-family: "Tajawal", sans-serif; font-weight: 800; font-size: 70px; line-height: 1.25;
        color: #fff; text-shadow: 0 3px 12px rgba(0, 0, 0, 0.6), 0 0 4px rgba(0, 0, 0, 0.55), 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      .cue .w { display: inline-block; opacity: 0; transform-origin: 50% 60%; }
      .cue .w.hl { color: #ffe11a; }
      .cue .w.lat { font-size: 0.94em; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-wk8z" id="root" data-composition-id="zukhri-arada" data-width="1080" data-height="1920" data-duration="40.5">
      <div id="stage">
        <div data-hf-id="hf-ftaq" id="cam">
          <video data-hf-id="hf-lp70" id="el-source" src="assets/source.mp4" data-start="0" data-duration="40.5" data-track-index="0" data-has-audio="true" data-volume="1.35" playsinline></video>
        </div>
        <div id="broll-aerial" class="clip broll" data-start="3.8" data-duration="2.2" data-track-index="3"><img id="img-aerial" src="assets/broll/aerial.jpg" alt="" data-kb="kb-pan" data-p0="20% 50%" data-p1="75% 50%" style="object-position: 20% 50%"></div>
        <div id="broll-location" class="clip broll" data-start="9.18" data-duration="3.12" data-track-index="4"><img id="img-location" src="assets/broll/aerial-plaza.jpg" alt="" data-kb="kb-zoom" data-p0="50% 50%" data-p1="50% 50%" style="object-position: 50% 50%"></div>
        <div id="broll-masterplan" class="clip broll" data-start="12.3" data-duration="2.433" data-track-index="3"><img id="img-masterplan" src="assets/broll/masterplan.jpg" alt="" data-kb="kb-zoom" data-p0="50% 50%" data-p1="50% 50%" style="object-position: 50% 50%"></div>
        <div id="broll-building10" class="clip broll" data-start="16.4" data-duration="2.1" data-track-index="4"><img id="img-building10" src="assets/broll/building10.jpg" alt="" data-kb="kb-zoom" data-p0="40% 50%" data-p1="40% 50%" style="object-position: 40% 50%"></div>
        <div id="broll-rooftop" class="clip broll" data-start="18.5" data-duration="1.95" data-track-index="3"><img id="img-rooftop" src="assets/broll/rooftop.jpg" alt="" data-kb="kb-pan" data-p0="35% 50%" data-p1="60% 50%" style="object-position: 35% 50%"></div>
        <div id="broll-gardens" class="clip broll" data-start="20.45" data-duration="2.55" data-track-index="4"><img id="img-gardens" src="assets/broll/gardens.jpg" alt="" data-kb="kb-zoom" data-p0="50% 50%" data-p1="50% 50%" style="object-position: 50% 50%"></div>
        <div id="broll-walkway" class="clip broll" data-start="31.3" data-duration="2.1" data-track-index="3"><img id="img-walkway" src="assets/broll/walkway.jpg" alt="" data-kb="kb-zoom" data-p0="50% 50%" data-p1="50% 50%" style="object-position: 50% 50%"></div>
        <div id="broll-cluster" class="clip broll" data-start="34.2" data-duration="2.4" data-track-index="4"><img id="img-cluster" src="assets/broll/cluster.jpg" alt="" data-kb="kb-pan" data-p0="30% 50%" data-p1="65% 50%" style="object-position: 30% 50%"></div>
      </div>
      <audio id="el-music" src="assets/music-funky.mp3" data-start="0" data-duration="40.5" data-track-index="9" data-has-audio="true" data-volume="0.045" data-fade-in="0.8" data-fade-out="1.5"></audio>
      <div data-hf-id="hf-455s" id="flash" class="clip" data-start="0" data-duration="40.5" data-track-index="1"></div>
      <div data-hf-id="hf-mrdc" id="subs" class="clip" data-start="0" data-duration="40.5" data-track-index="2"></div>
    </div>

    <script src="captions.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- Edit-point transitions: blur + brighten "flash" into every cut (camera cuts
      // and brochure b-roll in/out), sharpen out of it — the reference's blur dissolve.
      const CUTS = [3.8, 14.733, 23.0, 33.4];
      const brolls = [...document.querySelectorAll(".broll")];
      const EDITS = [...new Set([...CUTS, ...brolls.flatMap((b) => {
        const s0 = +b.dataset.start; return [s0, +(s0 + +b.dataset.duration).toFixed(3)];
      })])].sort((a, b) => a - b);
      EDITS.forEach((c) => {
        tl.fromTo("#stage",
          { filter: "blur(0px) brightness(1)", scale: 1 },
          { filter: "blur(22px) brightness(1.35)", scale: 1.07, duration: 0.18, ease: "power2.in", immediateRender: false }, c - 0.18);
        tl.fromTo("#stage",
          { filter: "blur(22px) brightness(1.35)", scale: 1.07 },
          { filter: "blur(0px) brightness(1)", scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, c);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.22, duration: 0.18, ease: "power2.in", immediateRender: false }, c - 0.18);
        tl.fromTo("#flash", { opacity: 0.22 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, c);
      });

      // ---- Brochure b-roll: slow Ken Burns drift (pan across wide renders, gentle push on the rest).
      brolls.forEach((b) => {
        const img = b.querySelector("img");
        const t0 = +b.dataset.start, d = +b.dataset.duration;
        if (img.dataset.kb === "kb-pan") {
          tl.fromTo(img, { objectPosition: img.dataset.p0, scale: 1.04 },
            { objectPosition: img.dataset.p1, scale: 1.0, duration: d, ease: "none", immediateRender: false }, t0);
        } else {
          tl.fromTo(img, { scale: 1.14 }, { scale: 1.0, duration: d, ease: "power1.out", immediateRender: false }, t0);
        }
      });

      // ---- Arabic captions: words build one at a time inside short 1–3 word chunks.
      const subs = document.getElementById("subs");
      (window.CAPTIONS || []).forEach((cue, i) => {
        const el = document.createElement("div");
        el.className = "cue";
        el.id = "cue-" + i;
        cue.words.forEach((w, j) => {
          const s = document.createElement("span");
          s.className = "w" + (w.hl ? " hl" : "") + (/^[A-Za-z0-9]/.test(w.w) ? " lat" : "");
          s.id = `cue-${i}-w-${j}`;
          s.textContent = w.w;
          el.appendChild(s);
        });
        subs.appendChild(el);
        tl.set(el, { opacity: 1 }, cue.start);
        tl.set(el, { opacity: 0 }, cue.end);
        cue.words.forEach((w, j) => {
          tl.fromTo(`#cue-${i}-w-${j}`,
            { opacity: 0, scale: 1.18, y: 6 },
            { opacity: 1, scale: 1, y: 0, duration: 0.14, ease: "back.out(2)", immediateRender: false },
            Math.max(cue.start, w.t));
        });
      });

      tl.set({}, {}, 40.5);
      window.__timelines["zukhri-arada"] = tl;
    </script>
  </body>
</html>
